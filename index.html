<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Middle Assembly of Las Naciones</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="imagenes/favicom.png">
</head>
<body>

    <!-- Barra de Navegación Superior -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="imagenes/Logo.png" alt="Logo Middle Assembly" class="logo-site">
                <div class="logo-text">
                    <span class="brand-name">Instituto Middle Assembly of Las Naciones</span>
                    <span class="brand-sub">Departamento de Desarrollo y Liderazgo</span>
                </div>
            </div>
        </div>

        <!-- Botón Hamburguesa -->
        <button class="menu-toggle" id="mobile-menu-btn" aria-label="Abrir menú">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Menú de Navegación -->
        <nav class="nav-links" id="nav-menu">
            <a href="#" class="active">Clases</a>
            <a href="#">Calendario</a>
            <a href="#">Recursos</a>
        </nav>
    </header>

    <!-- Banner Principal / Hero Section -->
    <section class="hero-section">
        <div class="hero-overlay"></div>
    </section>

    <!-- Sección de Contenido (Grid de Videos) -->
    <main class="content-section">
        <h3 class="section-title">Más Recursos</h3>
        
        <div class="video-grid">
            <a href="https://www.rca.org/about/theology/creeds-and-confessions/the-apostles-creed/" target="_blank" rel="noopener noreferrer" class="video-card">
                <img src="imagenes/credo-de-los-apostoles.png" alt="Credo de los apostoles">
                <div class="card-overlay">
                    <p class="card-title">El Credo de los apostoles</p>
                </div>
            </a>

            <a href="https://www.rca.org/about/theology/creeds-and-confessions/the-nicene-creed/" target="_blank" rel="noopener noreferrer" class="video-card">
                <img src="imagenes/credo-de-nicea.jpg" alt="Credo de Nicea">
                <div class="card-overlay">
                    <p class="card-title">El Credo de Nicea</p>
                </div>
            </a>

            <a href="https://www.rca.org/about/theology/creeds-and-confessions/the-athanasian-creed/" target="_blank" rel="noopener noreferrer" class="video-card">
                <img src="imagenes/credo-de-atanasio.jpg" alt="Credo de Atanasio">
                <div class="card-overlay">
                    <p class="card-title">El Credo de Atanasio</p>
                </div>
            </a>

            <a href="https://www.rca.org/about/theology/creeds-and-confessions/the-heidelberg-catechism/" target="_blank" rel="noopener noreferrer" class="video-card">
                <img src="imagenes/catesismo-de-heidelberg.jpg" alt="El Catecismo de Heidelberg">
                <div class="card-overlay">
                    <p class="card-title">El Catecismo de Heidelberg</p>
                </div>
            </a>

            <a href="https://www.rca.org/about/theology/creeds-and-confessions/the-belgic-confession/" target="_blank" rel="noopener noreferrer" class="video-card">
                <img src="imagenes/confesion-belga.jpg" alt="La Confesión Belga">
                <div class="card-overlay">
                    <p class="card-title">La Confesión Belga</p>
                </div>
            </a>

            <a href="https://www.rca.org/about/theology/creeds-and-confessions/canons-of-dort/" target="_blank" rel="noopener noreferrer" class="video-card">
                <img src="imagenes/canones-de-dort.jpg" alt="Los Cánones de Dort">
                <div class="card-overlay">
                    <p class="card-title">Los Cánones de Dort</p>
                </div>
            </a>

            <a href="https://www.rca.org/about/theology/creeds-and-confessions/the-belhar-confession/" target="_blank" rel="noopener noreferrer" class="video-card">
                <img src="imagenes/confesion-belhar.jpg" alt="La confesión Belhar">
                <div class="card-overlay">
                    <p class="card-title">La confesión Belhar</p>
                </div>
            </a>
        </div>
    </main>

    <!-- Vinculación del archivo JS externo -->
    <script src="script.js"></script>
</body>
</html>
